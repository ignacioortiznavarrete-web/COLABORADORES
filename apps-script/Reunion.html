<script>
/* ══════════════════════════════════════════════════════
   REUNIÓN SEMANAL
   Los hechos los calcula el tablero; las decisiones se
   escriben acá y quedan en el libro.
   ══════════════════════════════════════════════════════ */

const REUNION = (() => {

  let ESTADO = null;
  let SEMANA = '';
  let CARGANDO = false;

  const ICONO = {
    bueno: '<polyline points="20 6 9 17 4 12"/>',
    alerta: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
    neutro: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>'
  };

  /* ── Arranque ───────────────────────────────────── */

  function iniciar() {
    if (ESTADO || CARGANDO) return;
    conectar();
    cargar('');
  }

  function conectar() {
    document.getElementById('semanaSelector').addEventListener('change', e => cargar(e.target.value));
    document.getElementById('formaAccion').addEventListener('submit', agregarAccion);
    document.getElementById('formaApunte').addEventListener('submit', guardarApunte);
    document.getElementById('btnExportarActa').addEventListener('click', exportarActa);
  }

  function cargar(semana) {
    CARGANDO = true;
    progreso(true);

    google.script.run
      .withSuccessHandler(recibir)
      .withFailureHandler(err => {
        CARGANDO = false;
        progreso(false);
        avisar('No se pudo abrir la reunión de la semana: ' + (err && err.message || err), true);
      })
      .getReunionSemanal(semana || '');
  }

  function recibir(estado) {
    CARGANDO = false;
    progreso(false);

    ESTADO = estado || {};
    SEMANA = ESTADO.semana || '';

    pintarSelector();
    pintarResumen();
    pintarAcciones();
    pintarApunte();
  }

  /* ── Selector de semana ─────────────────────────── */

  function pintarSelector() {
    const sel = document.getElementById('semanaSelector');
    sel.textContent = '';

    (ESTADO.semanasDisponibles || [SEMANA]).forEach(clave => {
      const o = document.createElement('option');
      o.value = clave;
      o.textContent = etiquetaSemana(clave);
      sel.appendChild(o);
    });

    sel.value = SEMANA;
  }

  function etiquetaSemana(clave) {
    const m = String(clave || '').match(/^(\d{4})-W(\d{2})$/);
    if (!m) return clave;
    return 'Semana ' + Number(m[2]) + ' de ' + m[1];
  }

  /* ── Resumen automático ─────────────────────────── */

  function pintarResumen() {
    const cont = document.getElementById('listaHechos');
    const resumen = ESTADO.resumen || {};

    cont.textContent = '';
    texto('resumenGenerado', resumen.generado ? 'Calculado el ' + resumen.generado : '');

    if (!resumen.disponible || !(resumen.hechos || []).length) {
      const d = document.createElement('div');
      d.className = 'gr-vacio';
      d.textContent = resumen.motivo || 'Todavía no hay ingresos registrados en esta semana.';
      cont.appendChild(d);
      return;
    }

    resumen.hechos.forEach(h => {
      const fila = document.createElement('div');
      fila.className = 'hecho';

      const marca = document.createElement('span');
      marca.className = 'hecho-marca es-' + (h.tono || 'neutro');
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.innerHTML = ICONO[h.tono] || ICONO.neutro;
      marca.appendChild(svg);
      fila.appendChild(marca);

      const cuerpo = document.createElement('div');

      const tema = document.createElement('div');
      tema.className = 'hecho-tema';
      tema.textContent = h.tema;
      cuerpo.appendChild(tema);

      const tx = document.createElement('p');
      tx.className = 'hecho-texto';
      tx.textContent = h.texto;                  // texto del servidor: siempre como texto
      cuerpo.appendChild(tx);

      fila.appendChild(cuerpo);
      cont.appendChild(fila);
    });
  }

  /* ── Plan de acción ─────────────────────────────── */

  function pintarAcciones() {
    const cont = document.getElementById('listaAcciones');
    cont.textContent = '';

    const todas = ESTADO.acciones || [];

    // Abiertas primero, y dentro de ellas las que vencen antes.
    const abiertas = todas.filter(a => a.estado !== 'Cerrada');
    const cerradas = todas.filter(a => a.estado === 'Cerrada' && a.semana === SEMANA);

    const orden = (a, b) => {
      const pa = { Alta: 0, Media: 1, Baja: 2 }[a.prioridad] ?? 1;
      const pb = { Alta: 0, Media: 1, Baja: 2 }[b.prioridad] ?? 1;
      if (pa !== pb) return pa - pb;
      if (a.vencimiento && b.vencimiento) return a.vencimiento < b.vencimiento ? -1 : 1;
      if (a.vencimiento) return -1;
      if (b.vencimiento) return 1;
      return 0;
    };

    const lista = abiertas.sort(orden).concat(cerradas);

    texto('conteoAcciones', abiertas.length
      ? fmt0(abiertas.length) + ' abierta' + (abiertas.length === 1 ? '' : 's') +
        (cerradas.length ? ' · ' + fmt0(cerradas.length) + ' cerrada' + (cerradas.length === 1 ? '' : 's') + ' esta semana' : '')
      : 'sin acciones abiertas');

    if (!lista.length) {
      const d = document.createElement('div');
      d.className = 'gr-vacio';
      d.textContent = 'No hay acciones registradas. La primera se agrega con el formulario de arriba.';
      cont.appendChild(d);
      return;
    }

    const hoy = new Date().toISOString().slice(0, 10);

    lista.forEach(a => cont.appendChild(filaAccion(a, hoy)));
  }

  function filaAccion(a, hoy) {
    const cerrada = a.estado === 'Cerrada';
    const vencida = !cerrada && a.vencimiento && a.vencimiento < hoy;

    const fila = document.createElement('div');
    fila.className = 'accion' + (cerrada ? ' esta-cerrada' : '') + (vencida ? ' esta-vencida' : '');

    // Marcar como cerrada
    const check = document.createElement('button');
    check.className = 'accion-estado';
    check.type = 'button';
    check.setAttribute('aria-pressed', String(cerrada));
    check.setAttribute('aria-label', cerrada ? 'Reabrir la acción' : 'Cerrar la acción');
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.innerHTML = '<polyline points="20 6 9 17 4 12"/>';
    check.appendChild(svg);
    check.addEventListener('click', () => cambiarEstado(a.id, cerrada ? 'Pendiente' : 'Cerrada'));
    fila.appendChild(check);

    const cuerpo = document.createElement('div');
    cuerpo.className = 'accion-cuerpo';

    const tx = document.createElement('div');
    tx.className = 'accion-texto';
    tx.textContent = a.accion;
    cuerpo.appendChild(tx);

    const meta = document.createElement('div');
    meta.className = 'accion-meta';

    if (a.prioridad) {
      meta.appendChild(insignia(a.prioridad,
        a.prioridad === 'Alta' ? 'critico' : a.prioridad === 'Media' ? 'aviso' : 'neutro'));
    }

    if (a.estado && a.estado !== 'Pendiente') {
      meta.appendChild(insignia(a.estado, cerrada ? 'bueno' : a.estado === 'Bloqueada' ? 'critico' : 'neutro'));
    }

    const agregarMeta = (etiqueta, valorTexto, resaltar) => {
      if (!valorTexto) return;
      const s = document.createElement('span');
      const b = document.createElement('b');
      b.textContent = etiqueta + ' ';
      s.appendChild(b);
      s.appendChild(document.createTextNode(valorTexto));
      if (resaltar) { s.style.color = 'var(--critico)'; s.style.fontWeight = '650'; }
      meta.appendChild(s);
    };

    agregarMeta('Responsable:', a.responsable);
    agregarMeta(vencida ? 'Venció:' : 'Vence:', a.vencimiento, vencida);
    agregarMeta('Tema:', a.tema);
    if (a.semana !== SEMANA) agregarMeta('Viene de:', etiquetaSemana(a.semana));

    cuerpo.appendChild(meta);
    fila.appendChild(cuerpo);

    const mandos = document.createElement('div');
    mandos.className = 'accion-mandos';

    const selEstado = document.createElement('select');
    selEstado.style.width = 'auto';
    selEstado.style.fontSize = '11.5px';
    selEstado.style.padding = '4px 7px';
    selEstado.setAttribute('aria-label', 'Estado de la acción');

    (ESTADO.estados || ['Pendiente', 'En curso', 'Bloqueada', 'Cerrada']).forEach(e => {
      const o = document.createElement('option');
      o.value = e;
      o.textContent = e;
      selEstado.appendChild(o);
    });

    selEstado.value = a.estado;
    selEstado.addEventListener('change', () => cambiarEstado(a.id, selEstado.value));
    mandos.appendChild(selEstado);

    const borrar = document.createElement('button');
    borrar.className = 'btn btn-fantasma';
    borrar.type = 'button';
    borrar.textContent = 'Eliminar';
    borrar.addEventListener('click', () => eliminar(a));
    mandos.appendChild(borrar);

    fila.appendChild(mandos);
    return fila;
  }

  function agregarAccion(evt) {
    evt.preventDefault();

    const accion = document.getElementById('accionTexto').value.trim();
    if (!accion) return;

    const boton = document.getElementById('btnAgregarAccion');
    boton.disabled = true;
    progreso(true);

    google.script.run
      .withSuccessHandler(estado => {
        boton.disabled = false;
        recibir(estado);
        document.getElementById('formaAccion').reset();
        document.getElementById('accionPrioridad').value = 'Media';
        destello('avisoAccion');
      })
      .withFailureHandler(err => {
        boton.disabled = false;
        progreso(false);
        avisar('No se pudo guardar la acción: ' + (err && err.message || err), true);
      })
      .guardarAccion({
        semana: SEMANA,
        accion,
        responsable: document.getElementById('accionResponsable').value.trim(),
        vencimiento: document.getElementById('accionVencimiento').value,
        prioridad: document.getElementById('accionPrioridad').value,
        tema: document.getElementById('accionTema').value.trim(),
        estado: 'Pendiente'
      });
  }

  function cambiarEstado(id, estado) {
    progreso(true);
    google.script.run
      .withSuccessHandler(recibir)
      .withFailureHandler(err => {
        progreso(false);
        avisar('No se pudo actualizar la acción: ' + (err && err.message || err), true);
      })
      .actualizarEstadoAccion(id, estado, SEMANA);
  }

  function eliminar(a) {
    confirmar('Eliminar la acción',
      '«' + a.accion + '» se borra de la hoja PlanAccion y no se puede recuperar.',
      'Eliminar').then(ok => {
        if (!ok) return;
        progreso(true);
        google.script.run
          .withSuccessHandler(recibir)
          .withFailureHandler(err => {
            progreso(false);
            avisar('No se pudo eliminar la acción: ' + (err && err.message || err), true);
          })
          .eliminarAccion(a.id, SEMANA);
      });
  }

  /* ── Apuntes ────────────────────────────────────── */

  function pintarApunte() {
    const a = ESTADO.apunte || {};
    const rango = ESTADO.rango || {};

    document.getElementById('apunteFecha').value = a.fechaReunion || rango.desde || '';
    document.getElementById('apunteParticipantes').value = a.participantes || '';
    document.getElementById('apunteFoco').value = a.foco || '';
    document.getElementById('apunteTexto').value = a.apuntes || '';
    document.getElementById('apunteAcuerdos').value = a.acuerdos || '';
  }

  function guardarApunte(evt) {
    evt.preventDefault();

    const boton = document.getElementById('btnGuardarApunte');
    boton.disabled = true;
    progreso(true);

    google.script.run
      .withSuccessHandler(estado => {
        boton.disabled = false;
        recibir(estado);
        destello('avisoApunte');
      })
      .withFailureHandler(err => {
        boton.disabled = false;
        progreso(false);
        avisar('No se pudieron guardar los apuntes: ' + (err && err.message || err), true);
      })
      .guardarApunteSemanal({
        semana: SEMANA,
        fechaReunion: document.getElementById('apunteFecha').value,
        participantes: document.getElementById('apunteParticipantes').value,
        foco: document.getElementById('apunteFoco').value,
        apuntes: document.getElementById('apunteTexto').value,
        acuerdos: document.getElementById('apunteAcuerdos').value
      });
  }

  function destello(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('se-ve');
    setTimeout(() => el.classList.remove('se-ve'), 2400);
  }

  /* ── Acta ───────────────────────────────────────── */

  function exportarActa() {
    if (!ESTADO) return;

    const a = ESTADO.apunte || {};
    const rango = ESTADO.rango || {};
    const resumen = ESTADO.resumen || {};
    const lineas = [];

    lineas.push(['ACTA DE REUNIÓN SEMANAL']);
    lineas.push([etiquetaSemana(SEMANA) + ' · del ' + (rango.desde || '') + ' al ' + (rango.hasta || '')]);
    lineas.push([]);
    lineas.push(['Fecha de la reunión', a.fechaReunion || '']);
    lineas.push(['Participantes', a.participantes || '']);
    lineas.push(['Foco de la semana', a.foco || '']);
    lineas.push([]);

    lineas.push(['HECHOS DE LA SEMANA']);
    lineas.push(['Tema', 'Hecho']);
    (resumen.hechos || []).forEach(h => lineas.push([h.tema, h.texto]));
    lineas.push([]);

    lineas.push(['APUNTES']);
    (a.apuntes || '').split('\n').forEach(l => lineas.push([l]));
    lineas.push([]);

    lineas.push(['ACUERDOS']);
    (a.acuerdos || '').split('\n').forEach(l => lineas.push([l]));
    lineas.push([]);

    lineas.push(['PLAN DE ACCIÓN']);
    lineas.push(['Estado', 'Prioridad', 'Acción', 'Responsable', 'Vence', 'Tema', 'Semana de origen']);

    (ESTADO.acciones || []).forEach(x => lineas.push([
      x.estado, x.prioridad, x.accion, x.responsable, x.vencimiento, x.tema, etiquetaSemana(x.semana)
    ]));

    descargarCSV('acta_' + SEMANA + '.csv', lineas);
  }

  return { iniciar, cargar };
})();
</script>
