<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /*
    Verde bosque sobre papel con tinte verde. El color no decora: la operación
    es madera de pino radiata, y el verde carga la cabecera y la acción
    principal. Los neutros llevan croma hacia el mismo tono, nunca hacia el
    beige.
  */
  :root {
    --bosque-900: oklch(0.24 0.045 158);
    --bosque-800: oklch(0.31 0.058 158);
    --bosque-700: oklch(0.38 0.072 157);
    --bosque-600: oklch(0.47 0.095 156);
    --bosque-500: oklch(0.55 0.105 155);
    --bosque-200: oklch(0.88 0.045 157);
    --bosque-100: oklch(0.94 0.028 157);
    --bosque-050: oklch(0.972 0.014 157);

    --fondo: oklch(0.965 0.007 157);
    --papel: oklch(0.995 0.002 157);
    --tinta: oklch(0.21 0.014 157);
    --tinta-suave: oklch(0.46 0.018 157);
    --linea: oklch(0.89 0.008 157);

    --ambar: oklch(0.58 0.115 72);
    --ambar-fondo: oklch(0.965 0.03 82);
    --rojo: oklch(0.51 0.17 27);
    --rojo-fondo: oklch(0.965 0.022 25);

    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;

    --r-chico: 6px;
    --r: 10px;
    --r-grande: 12px;

    --salida: cubic-bezier(0.16, 1, 0.3, 1);

    --z-base: 1;
    --z-banco: 20;
    --z-cabecera: 30;
    --z-aviso: 40;
  }

  * { box-sizing: border-box; }

  /* Varias clases traen display:flex, que le gana al atributo hidden. */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--fondo);
    color: var(--tinta);
    font: 15px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 940px; margin: 0 auto; padding: 0 20px 72px; }

  /* ------------------------------------------------------------- cabecera */

  header.app {
    background: var(--bosque-900);
    color: oklch(0.97 0.012 157);
    position: sticky;
    top: 0;
    z-index: var(--z-cabecera);
  }
  .cabecera-fila {
    max-width: 940px; margin: 0 auto; padding: 14px 20px 12px;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header.app h1 {
    margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
  }
  header.app .quien {
    margin-left: auto; font-size: 12.5px; color: oklch(0.83 0.03 157);
    font-family: var(--mono);
  }

  /* Los pasos son una secuencia real: numerarlos dice en cuál vas. */
  .ruta {
    max-width: 940px; margin: 0 auto; padding: 0 20px;
    display: flex; gap: 2px; flex-wrap: wrap;
  }
  .ruta button {
    appearance: none; background: none; border: 0; cursor: default;
    font: 500 12.5px/1 var(--sans); color: oklch(0.72 0.03 157);
    padding: 9px 12px 11px; border-bottom: 2px solid transparent;
    display: flex; align-items: center; gap: 7px;
    transition: color 160ms var(--salida), border-color 160ms var(--salida);
  }
  .ruta button .n {
    font-family: var(--mono); font-size: 11px; opacity: .75;
  }
  .ruta button.hecho { color: oklch(0.86 0.04 157); cursor: pointer; }
  .ruta button.hecho:hover { color: #fff; }
  .ruta button.on {
    color: #fff; border-bottom-color: var(--bosque-500);
  }
  .ruta button:focus-visible {
    outline: 2px solid var(--bosque-200); outline-offset: -2px; border-radius: var(--r-chico);
  }

  /* ------------------------------------------------- pegar un código listo */

  .pegar {
    margin: 18px 0 0;
    padding: 14px 18px;
    background: var(--papel);
    border: 1px solid var(--linea);
    border-radius: var(--r-grande);
  }
  .pegar-fila { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pegar label.tit {
    display: block; font-size: 12px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--tinta-suave); margin-bottom: 8px;
  }
  /* Con el selector del contenedor, para ganarle a la regla general de input. */
  .pegar input.codigo-entrada {
    font-family: var(--mono); font-size: 16px; letter-spacing: .08em; text-transform: uppercase;
    width: 21ch; max-width: 100%; flex: 0 1 auto;
  }
  .pegar-nota { font-size: 13px; color: var(--tinta-suave); }
  .pegar .aviso { margin: 12px 0 0; }

  /* ------------------------------------------- el banco: el código en vivo */

  .banco {
    position: sticky; top: 84px; z-index: var(--z-banco);
    background: var(--papel);
    border: 1px solid var(--linea);
    border-radius: var(--r-grande);
    margin: 18px 0 24px;
    overflow: hidden;
  }
  .banco-cuerpo { padding: 16px 18px 14px; }
  .banco-rotulo {
    font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
    color: var(--tinta-suave); margin-bottom: 12px;
  }

  .codigo {
    display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap;
    font-family: var(--mono);
  }
  .tramo { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .tramo-chars { display: flex; gap: 3px; }
  .tramo-pie {
    font: 500 10px/1.2 var(--sans); letter-spacing: .05em; text-transform: uppercase;
    color: var(--tinta-suave); text-align: center; white-space: nowrap;
  }
  .ch {
    width: clamp(24px, 5.2vw, 34px);
    height: clamp(34px, 7vw, 46px);
    display: grid; place-items: center;
    font-size: clamp(16px, 3.4vw, 22px); font-weight: 500;
    background: var(--bosque-050);
    border: 1px solid var(--linea);
    border-radius: var(--r-chico);
    color: var(--tinta);
  }
  .ch.vacio { border-style: dashed; color: transparent; background: transparent; }
  .ch.puesto { animation: aterriza 240ms var(--salida) both; }
  .ch.sep {
    width: 14px; background: none; border: 0; color: var(--tinta-suave); font-size: 15px;
  }
  @keyframes aterriza {
    from { opacity: 0; transform: translateY(-4px) scale(.92); }
    to   { opacity: 1; transform: none; }
  }

  .codigo-plano {
    margin-top: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-family: var(--mono); font-size: 14px;
  }
  .codigo-plano b { font-weight: 700; letter-spacing: .04em; }
  .codigo-plano .largo-codigo { color: var(--tinta-suave); font-size: 12px; }
  .codigo-plano .pista { font-family: var(--sans); font-size: 13px; color: var(--tinta-suave); }

  /* Línea de progreso mientras se consulta la base. */
  .buscando { height: 2px; background: var(--bosque-100); overflow: hidden; }
  .buscando i {
    display: block; height: 100%; width: 40%; background: var(--bosque-600);
    animation: corre 1.1s ease-in-out infinite;
  }
  @keyframes corre {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  .banco-ficha {
    border-top: 1px solid var(--linea); background: var(--bosque-050);
    padding: 12px 18px; font-size: 13px;
    display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline;
  }
  .banco-ficha .desc { font-weight: 600; }
  .banco-ficha .dato { color: var(--tinta-suave); }
  .banco-ficha .dato b { font-family: var(--mono); font-weight: 500; color: var(--tinta); }
  .banco-ficha.malo { background: var(--rojo-fondo); color: var(--rojo); }
  .banco-ficha.aviso { background: var(--ambar-fondo); color: var(--ambar); }

  /* ------------------------------------------------------------- los pasos */

  .paso { animation: entra 260ms var(--salida) both; }
  .paso[hidden] { display: none; }
  @keyframes entra {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  .paso h2 {
    margin: 0 0 4px; font-size: 19px; font-weight: 600; letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .paso p.ayuda {
    margin: 0 0 18px; font-size: 13.5px; color: var(--tinta-suave);
    max-width: 68ch; text-wrap: pretty;
  }
  .grupo { margin-bottom: 22px; }
  .grupo > h3 {
    margin: 0 0 9px; font-size: 12px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--tinta-suave);
  }

  /* Opciones: filas y chips, no tarjetas. */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    appearance: none; cursor: pointer; font: 500 14px/1 var(--sans); color: var(--tinta);
    background: var(--papel); border: 1px solid var(--linea); border-radius: 999px;
    padding: 9px 16px;
    transition: background 140ms var(--salida), border-color 140ms var(--salida), color 140ms var(--salida);
  }
  .chip:hover { border-color: var(--bosque-500); }
  .chip[aria-pressed="true"] {
    background: var(--bosque-600); border-color: var(--bosque-600); color: #fff;
  }
  .chip.mono { font-family: var(--mono); letter-spacing: .03em; }

  .filas { display: flex; flex-direction: column; gap: 6px; }
  .fila-opcion {
    appearance: none; cursor: pointer; text-align: left; width: 100%;
    font: 15px/1.4 var(--sans); color: var(--tinta);
    background: var(--papel); border: 1px solid var(--linea); border-radius: var(--r);
    padding: 12px 15px;
    display: flex; align-items: baseline; gap: 12px;
    transition: background 140ms var(--salida), border-color 140ms var(--salida);
  }
  .fila-opcion:hover { border-color: var(--bosque-500); background: var(--bosque-050); }
  .fila-opcion[aria-pressed="true"] {
    border-color: var(--bosque-600); background: var(--bosque-100);
    box-shadow: inset 0 0 0 1px var(--bosque-600);
  }
  .fila-opcion .cod {
    font-family: var(--mono); font-weight: 700; font-size: 14px; letter-spacing: .04em;
    min-width: 5ch;
  }
  .fila-opcion .txt { flex: 1; }
  .fila-opcion .etapas {
    font: 500 10.5px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase;
    color: var(--tinta-suave); display: flex; gap: 6px;
  }
  .fila-opcion .etapas span { padding: 3px 7px; background: var(--bosque-050); border-radius: 999px; }
  .fila-opcion[aria-pressed="true"] .etapas span { background: oklch(0.99 0.005 157); }

  /* Medidas */
  .medidas { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
  label.campo { display: block; }
  label.campo > span.tit {
    display: block; font-size: 12px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--tinta-suave); margin-bottom: 6px;
  }
  input[type=text], input[type=number], select {
    font: 15px/1.3 var(--sans); color: var(--tinta);
    background: var(--papel); border: 1px solid var(--linea); border-radius: var(--r-chico);
    padding: 10px 12px; width: 100%;
    transition: border-color 140ms var(--salida), box-shadow 140ms var(--salida);
  }
  input.num {
    font-family: var(--mono); font-size: 17px; letter-spacing: .06em; text-align: center;
    width: 6.5ch; padding: 10px 8px;
  }
  input:focus, select:focus {
    outline: none; border-color: var(--bosque-600);
    box-shadow: 0 0 0 3px oklch(0.47 0.095 156 / .16);
  }
  /* El placeholder también tiene que leerse: 4.5:1 contra el papel. */
  input::placeholder { color: oklch(0.54 0.018 157); opacity: 1; }
  .porX { font-family: var(--mono); color: var(--tinta-suave); padding-bottom: 11px; }

  .largos { margin-top: 16px; }
  .largos .chip { font-family: var(--mono); }
  .largos .chip.entrando { animation: entra 200ms var(--salida) both; }

  /* Desglose: es una tabla de etapas, no tarjetas. */
  table.desglose { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.desglose th {
    text-align: left; font: 600 11.5px/1 var(--sans); letter-spacing: .05em;
    text-transform: uppercase; color: var(--tinta-suave);
    padding: 0 10px 8px 0; border-bottom: 1px solid var(--linea);
  }
  table.desglose td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--linea); vertical-align: middle; }
  table.desglose td:last-child, table.desglose th:last-child { padding-right: 0; }
  table.desglose .etapa { font-weight: 600; white-space: nowrap; }
  table.desglose select { min-width: 15ch; font-family: var(--mono); font-size: 13.5px; }
  table.desglose tr.no-aplica td { color: var(--tinta-suave); }
  table.desglose tr.no-aplica .motivo { font-size: 12.5px; font-style: italic; }

  /* Resumen */
  dl.resumen {
    margin: 0; display: grid; grid-template-columns: minmax(140px, 200px) 1fr;
    gap: 0; font-size: 14px;
  }
  dl.resumen dt {
    color: var(--tinta-suave); padding: 8px 12px 8px 0; border-bottom: 1px solid var(--linea);
  }
  dl.resumen dd {
    margin: 0; padding: 8px 0; border-bottom: 1px solid var(--linea); font-weight: 500;
  }
  dl.resumen dd.mono { font-family: var(--mono); letter-spacing: .03em; }
  dl.resumen dt:last-of-type, dl.resumen dd:last-of-type { border-bottom: 0; }
  @media (max-width: 560px) {
    dl.resumen { grid-template-columns: 1fr; }
    dl.resumen dt { border-bottom: 0; padding-bottom: 0; }
  }

  /* ------------------------------------------------------------- acciones */

  .acciones {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--linea);
  }
  .acciones .derecha { margin-left: auto; }
  button.primario, button.secundario {
    appearance: none; font: 600 14.5px/1 var(--sans); border-radius: var(--r-chico);
    padding: 12px 22px; cursor: pointer; border: 1px solid transparent;
    transition: background 140ms var(--salida), border-color 140ms var(--salida), opacity 140ms;
  }
  button.primario { background: var(--bosque-600); color: #fff; }
  button.primario:hover:not(:disabled) { background: var(--bosque-700); }
  button.secundario { background: var(--papel); border-color: var(--linea); color: var(--tinta); }
  button.secundario:hover:not(:disabled) { border-color: var(--bosque-500); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--bosque-600); outline-offset: 2px; }

  /* --------------------------------------------------------------- avisos */

  .aviso {
    padding: 12px 15px; border-radius: var(--r); font-size: 14px; margin-bottom: 18px;
    border: 1px solid transparent;
  }
  .aviso b { display: block; margin-bottom: 2px; }
  .aviso.info { background: var(--bosque-050); border-color: var(--bosque-200); color: var(--bosque-800); }
  .aviso.ok { background: var(--bosque-100); border-color: var(--bosque-200); color: var(--bosque-800); }
  .aviso.error { background: var(--rojo-fondo); border-color: oklch(0.86 0.06 25); color: var(--rojo); }
  .aviso.alerta { background: var(--ambar-fondo); border-color: oklch(0.87 0.06 82); color: var(--ambar); }

  .vacio-estado {
    padding: 22px; border: 1px dashed var(--linea); border-radius: var(--r);
    color: var(--tinta-suave); font-size: 14px; text-align: center;
  }

  .cargando { text-align: center; padding: 56px 0; color: var(--tinta-suave); }

  /* Confirmación: el banco se llena de verde de izquierda a derecha. */
  .guardado .banco { border-color: var(--bosque-600); }
  .guardado .banco-cuerpo { position: relative; }
  .guardado .banco-cuerpo::after {
    content: ''; position: absolute; inset: 0; background: oklch(0.47 0.095 156 / .07);
    animation: barre 420ms var(--salida) both; pointer-events: none;
  }
  @keyframes barre {
    from { clip-path: inset(0 100% 0 0); }
    to   { clip-path: inset(0 0 0 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 1ms !important; animation-iteration-count: 1 !important;
      transition-duration: 1ms !important;
    }
    .buscando i { animation: none; width: 100%; opacity: .5; }
  }

  @media (max-width: 640px) {
    .banco { position: static; }
    header.app { position: static; }
    .tramo-pie { display: none; }
  }
</style>
