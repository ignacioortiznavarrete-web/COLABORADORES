<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /*
    Verde bosque sobre papel con tinte verde. El color no decora: la operación
    es madera de pino radiata, y el verde carga la cabecera y la acción
    principal. Los neutros llevan croma hacia el mismo tono, nunca hacia el
    beige.
  */
  :root {
    --bosque-900: oklch(0.24 0.045 158);
    --bosque-800: oklch(0.31 0.058 158);
    --bosque-700: oklch(0.38 0.072 157);
    --bosque-600: oklch(0.47 0.095 156);
    --bosque-500: oklch(0.55 0.105 155);
    --bosque-200: oklch(0.88 0.045 157);
    --bosque-100: oklch(0.94 0.028 157);
    --bosque-050: oklch(0.972 0.014 157);

    --fondo: oklch(0.965 0.007 157);
    --papel: oklch(0.995 0.002 157);
    --tinta: oklch(0.21 0.014 157);
    --tinta-suave: oklch(0.46 0.018 157);
    --linea: oklch(0.89 0.008 157);

    --ambar: oklch(0.58 0.115 72);
    --ambar-fondo: oklch(0.965 0.03 82);
    --rojo: oklch(0.51 0.17 27);
    --rojo-fondo: oklch(0.965 0.022 25);

    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;

    --r-chico: 6px;
    --r: 10px;
    --r-grande: 12px;

    --salida: cubic-bezier(0.16, 1, 0.3, 1);

    --z-base: 1;
    --z-banco: 20;
    --z-cabecera: 30;
    --z-aviso: 40;
  }

  * { box-sizing: border-box; }

  /* Varias clases traen display:flex, que le gana al atributo hidden. */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--fondo);
    color: var(--tinta);
    font: 15px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 940px; margin: 0 auto; padding: 0 20px 72px; }

  /* ------------------------------------------------------------- cabecera */

  header.app {
    background: var(--bosque-900);
    color: oklch(0.97 0.012 157);
    position: sticky;
    top: 0;
    z-index: var(--z-cabecera);
  }
  .cabecera-fila {
    max-width: 940px; margin: 0 auto; padding: 14px 20px 12px;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header.app h1 {
    margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
  }
  header.app .quien {
    margin-left: auto; font-size: 12.5px; color: oklch(0.83 0.03 157);
    font-family: var(--mono);
  }

  /* ------------------------------------------------- las cinco columnas */

  .pegar {
    margin: 22px 0 0;
    padding: 18px;
    background: var(--papel);
    border: 1px solid var(--linea);
    border-radius: var(--r-grande);
  }
  .pegar-fila { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pegar-nota { font-size: 13px; color: var(--tinta-suave); max-width: 78ch; text-wrap: pretty; }
  .pegar .aviso { margin: 14px 0 0; }

  .columnas { display: flex; gap: 10px; align-items: stretch; }
  .columna { display: flex; flex-direction: column; flex: 1 1 16ch; min-width: 0; }
  .columna.crece { flex: 1.6 1 22ch; }
  .columna.estrecha { flex: 0.5 1 8ch; }
  .columna .tit {
    font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    color: var(--tinta-suave); margin-bottom: 6px;
  }
  @media (max-width: 860px) {
    .columnas { flex-wrap: wrap; }
    .columna, .columna.crece, .columna.estrecha { flex: 1 1 100%; }
  }

  /* ------------------------------------------------------------- acciones */

  .acciones {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--linea);
  }
  .acciones .derecha { margin-left: auto; }
  button.primario, button.secundario {
    appearance: none; font: 600 14.5px/1 var(--sans); border-radius: var(--r-chico);
    padding: 12px 22px; cursor: pointer; border: 1px solid transparent;
    transition: background 140ms var(--salida), border-color 140ms var(--salida), opacity 140ms;
  }
  button.primario { background: var(--bosque-600); color: #fff; }
  button.primario:hover:not(:disabled) { background: var(--bosque-700); }
  button.secundario { background: var(--papel); border-color: var(--linea); color: var(--tinta); }
  button.secundario:hover:not(:disabled) { border-color: var(--bosque-500); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--bosque-600); outline-offset: 2px; }

  /* ---------------------------------------------------------- carga masiva */

  .wrap.ancho { max-width: 1240px; }

  textarea {
    width: 100%; font: 14px/1.6 var(--mono); letter-spacing: .04em;
    color: var(--tinta); background: var(--papel);
    border: 1px solid var(--linea); border-radius: var(--r-chico);
    padding: 12px 14px; resize: vertical; min-height: 120px;
    transition: border-color 140ms var(--salida), box-shadow 140ms var(--salida);
  }
  textarea:focus {
    outline: none; border-color: var(--bosque-600);
    box-shadow: 0 0 0 3px oklch(0.47 0.095 156 / .16);
  }

  .resumen-lote { margin: 22px 0 12px; font-size: 14px; color: var(--tinta-suave); }
  .resumen-lote b { color: var(--tinta); }
  .resumen-lote .ok { color: var(--bosque-700); font-weight: 600; }
  .resumen-lote .problema { color: var(--ambar); font-weight: 600; }

  /* La tabla es ancha a propósito: rueda dentro de su caja, no en la página. */
  .tabla-scroll {
    overflow-x: auto; border: 1px solid var(--linea); border-radius: var(--r-grande);
    background: var(--papel);
  }
  table.lote { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.lote th {
    text-align: left; font: 600 11px/1 var(--sans); letter-spacing: .05em;
    text-transform: uppercase; color: var(--tinta-suave); white-space: nowrap;
    padding: 12px 10px; border-bottom: 1px solid var(--linea); background: var(--bosque-050);
    position: sticky; top: 0; z-index: var(--z-base);
  }
  table.lote td {
    padding: 9px 10px; border-bottom: 1px solid var(--linea); vertical-align: middle;
  }
  table.lote tr:last-child td { border-bottom: 0; }
  table.lote tr.pendiente { background: var(--ambar-fondo); }
  table.lote tr.mala { background: var(--rojo-fondo); }
  table.lote .col-sel, table.lote .col-n { width: 1%; white-space: nowrap; }
  table.lote .col-n { color: var(--tinta-suave); font-family: var(--mono); font-size: 12px; }
  table.lote .col-pak { width: 8ch; }
  table.lote .mono { font-family: var(--mono); letter-spacing: .04em; }
  table.lote .fuerte { font-weight: 700; }
  table.lote .chico { font-size: 12.5px; }
  table.lote small {
    display: block; margin-top: 2px; font-size: 11.5px; color: var(--tinta-suave);
    max-width: 26ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  table.lote td.no-aplica { color: var(--tinta-suave); text-align: center; }
  table.lote td.falta { color: var(--ambar); font-size: 12.5px; font-style: italic; }
  table.lote .estado { max-width: 34ch; }
  table.lote .estado .ok { color: var(--bosque-700); font-weight: 600; }
  table.lote .estado .problema, table.lote td.problema { color: var(--ambar); font-size: 12.5px; }
  table.lote tr.mala td.problema { color: var(--rojo); }
  table.lote input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--bosque-600); }

  /* Barra de acciones: aparece cuando hay algo seleccionado. */
  .barra {
    position: sticky; bottom: 0; z-index: var(--z-banco);
    background: var(--bosque-900); color: #fff;
    animation: sube 220ms var(--salida) both;
  }
  @keyframes sube {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  .barra-dentro {
    max-width: 1240px; margin: 0 auto; padding: 12px 20px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 14px; font-weight: 600;
  }
  .barra-dentro .derecha { margin-left: auto; }
  .barra button.secundario { background: transparent; border-color: oklch(0.55 0.06 157); color: #fff; }
  .barra button.secundario:hover:not(:disabled) { border-color: #fff; }
  .barra #trabajando { color: oklch(0.85 0.03 157) !important; }

  /* --------------------------------------------------------------- avisos */

  .aviso {
    padding: 12px 15px; border-radius: var(--r); font-size: 14px; margin-bottom: 18px;
    border: 1px solid transparent;
  }
  .aviso b { display: block; margin-bottom: 2px; }
  .aviso.info { background: var(--bosque-050); border-color: var(--bosque-200); color: var(--bosque-800); }
  .aviso.ok { background: var(--bosque-100); border-color: var(--bosque-200); color: var(--bosque-800); }
  .aviso.error { background: var(--rojo-fondo); border-color: oklch(0.86 0.06 25); color: var(--rojo); }
  .aviso.alerta { background: var(--ambar-fondo); border-color: oklch(0.87 0.06 82); color: var(--ambar); }

  .vacio-estado {
    padding: 22px; border: 1px dashed var(--linea); border-radius: var(--r);
    color: var(--tinta-suave); font-size: 14px; text-align: center;
  }

  .cargando { text-align: center; padding: 56px 0; color: var(--tinta-suave); }

  /* Confirmación: el banco se llena de verde de izquierda a derecha. */
  .guardado .banco { border-color: var(--bosque-600); }
  .guardado .banco-cuerpo { position: relative; }
  .guardado .banco-cuerpo::after {
    content: ''; position: absolute; inset: 0; background: oklch(0.47 0.095 156 / .07);
    animation: barre 420ms var(--salida) both; pointer-events: none;
  }
  @keyframes barre {
    from { clip-path: inset(0 100% 0 0); }
    to   { clip-path: inset(0 0 0 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 1ms !important; animation-iteration-count: 1 !important;
      transition-duration: 1ms !important;
    }
    .buscando i { animation: none; width: 100%; opacity: .5; }
  }

  @media (max-width: 640px) {
    .banco { position: static; }
    header.app { position: static; }
    .tramo-pie { display: none; }
  }
</style>
