<!--
  Las cuentas del gráfico, sin nada del navegador.

  Van aparte para poder probarlas: son puras —entra una lista, sale otra— y
  ahí es donde se esconden los errores de fechas: dónde empieza la semana, qué
  pasa en el cambio de mes, un período sin ninguna solicitud. `pruebas/test.js`
  lee este archivo y las corre en Node.
-->
<script>
  var ESTADO_FINAL = 'Finalizado';

  function sinTildes(t) {
    return String(t == null ? '' : t)
      .normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  }

  /** `24.09.2026` o `24.09.2026 17:48` -> Date. Null si no tiene esa forma. */
  function aFecha(texto) {
    var m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})(?:[ ,]+(\d{1,2}):(\d{2}))?/
      .exec(String(texto == null ? '' : texto).trim());
    if (!m) return null;
    var d = new Date(+m[3], +m[2] - 1, +m[1], m[4] ? +m[4] : 0, m[5] ? +m[5] : 0);
    return isNaN(d.getTime()) ? null : d;
  }

  var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun',
               'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

  /** El comienzo del período al que cae una fecha. Lunes, en el caso de semana. */
  function inicioDe(fecha, escala) {
    var d = new Date(fecha.getFullYear(), fecha.getMonth(), fecha.getDate());
    if (escala === 'mes') return new Date(d.getFullYear(), d.getMonth(), 1);
    if (escala === 'semana') {
      // Lunes: getDay() da 0 el domingo, que acá es el final de la semana.
      var corrido = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - corrido);
    }
    return d;
  }

  function siguiente(fecha, escala) {
    var d = new Date(fecha.getTime());
    if (escala === 'mes') d.setMonth(d.getMonth() + 1);
    else d.setDate(d.getDate() + (escala === 'semana' ? 7 : 1));
    return d;
  }

  function clave(fecha) {
    return fecha.getFullYear() + '-' + (fecha.getMonth() + 1) + '-' + fecha.getDate();
  }

  function rotulo(fecha, escala) {
    if (escala === 'mes') return MESES[fecha.getMonth()] + ' ' + fecha.getFullYear();
    return fecha.getDate() + ' ' + MESES[fecha.getMonth()];
  }

  function rotuloLargo(fecha, escala) {
    if (escala === 'mes') return MESES[fecha.getMonth()] + ' ' + fecha.getFullYear();
    var hasta = new Date(siguiente(fecha, escala).getTime() - 86400000);
    if (escala === 'semana') {
      return 'semana del ' + fecha.getDate() + ' ' + MESES[fecha.getMonth()] +
        ' al ' + hasta.getDate() + ' ' + MESES[hasta.getMonth()];
    }
    return fecha.getDate() + ' ' + MESES[fecha.getMonth()] + ' ' + fecha.getFullYear();
  }

  /**
   * La escala que se ve bien sola: día mientras quepan, después semana, después
   * mes. Solo decide la primera vez; si alguien elige otra, manda la suya.
   */
  var TOPE_COLUMNAS = 120;

  function escalaSugerida(lista) {
    var fechas = lista.map(function (s) { return aFecha(s.fecha); }).filter(Boolean);
    if (!fechas.length) return 'dia';
    var desde = new Date(Math.min.apply(null, fechas));
    var hasta = new Date(Math.max.apply(null, fechas));
    var dias = Math.round((hasta - desde) / 86400000) + 1;
    if (dias <= 45) return 'dia';
    if (dias <= 370) return 'semana';
    return 'mes';
  }

  /**
   * Las solicitudes repartidas en columnas de tiempo.
   *
   * Los períodos sin ninguna solicitud igual salen: un día sin pedidos es un
   * hueco en el gráfico, no una columna que no existió. Si son demasiados para
   * que se vean, se muestran los últimos y se dice cuántos quedaron fuera.
   */
  function porPeriodo(lista, escala) {
    var conFecha = lista.map(function (s) {
      return { s: s, f: aFecha(s.fecha) };
    }).filter(function (x) { return x.f; });
    if (!conFecha.length) return { columnas: [], recortadas: 0, sinFecha: lista.length };

    var caja = {};
    conFecha.forEach(function (x) {
      var k = clave(inicioDe(x.f, escala));
      if (!caja[k]) caja[k] = [];
      caja[k].push(x.s);
    });

    var desde = inicioDe(new Date(Math.min.apply(null, conFecha.map(function (x) { return x.f; }))), escala);
    var hasta = inicioDe(new Date(Math.max.apply(null, conFecha.map(function (x) { return x.f; }))), escala);

    var columnas = [];
    for (var d = desde; d <= hasta; d = siguiente(d, escala)) {
      columnas.push({ fecha: d, solicitudes: caja[clave(d)] || [] });
    }

    var recortadas = Math.max(0, columnas.length - TOPE_COLUMNAS);
    if (recortadas) columnas = columnas.slice(-TOPE_COLUMNAS);

    return {
      columnas: columnas,
      recortadas: recortadas,
      sinFecha: lista.length - conFecha.length
    };
  }

  /**
   * La jornada, por día de la semana. 0 es domingo.
   *
   * Lunes a jueves de 8:00 a 17:30, viernes de 8:00 a 14:30. Las horas van en
   * minutos desde medianoche porque así se suman sin pelear con el reloj.
   *
   * Esto es lo que hace que la demora signifique algo: una solicitud que entra
   * un viernes a las 14:00 y se mira el lunes a las 9:00 no esperó tres días,
   * esperó una hora y media de trabajo. Contar las noches y los fines de
   * semana diría que codificación se demoró, cuando lo que pasó es que la
   * oficina estaba cerrada.
   */
  var JORNADA = [
    null,                                       // domingo
    { abre: 8 * 60, cierra: 17 * 60 + 30 },     // lunes
    { abre: 8 * 60, cierra: 17 * 60 + 30 },     // martes
    { abre: 8 * 60, cierra: 17 * 60 + 30 },     // miércoles
    { abre: 8 * 60, cierra: 17 * 60 + 30 },     // jueves
    { abre: 8 * 60, cierra: 14 * 60 + 30 },     // viernes
    null                                        // sábado
  ];

  /** Un tope por si una fecha mala pide recorrer años: no se cuelga la página. */
  var TOPE_DIAS_RECORRIDOS = 2000;

  /**
   * Las horas de trabajo que hay entre dos momentos.
   *
   * Recorre día por día e intersecta la jornada de cada uno con el tramo. Lo
   * que cae de noche, en fin de semana o después del cierre no suma.
   */
  function horasHabiles(inicio, fin) {
    if (!inicio || !fin) return null;
    if (fin < inicio) return null;

    var minutos = 0;
    var dia = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate());
    var vueltas = 0;
    while (dia <= fin) {
      if (++vueltas > TOPE_DIAS_RECORRIDOS) return null;
      var j = JORNADA[dia.getDay()];
      if (j) {
        var abre = new Date(dia.getFullYear(), dia.getMonth(), dia.getDate(), 0, j.abre);
        var cierra = new Date(dia.getFullYear(), dia.getMonth(), dia.getDate(), 0, j.cierra);
        var a = Math.max(abre.getTime(), inicio.getTime());
        var b = Math.min(cierra.getTime(), fin.getTime());
        if (b > a) minutos += (b - a) / 60000;
      }
      dia = new Date(dia.getFullYear(), dia.getMonth(), dia.getDate() + 1);
    }
    return minutos / 60;
  }

  /**
   * Cuántas horas de trabajo tardó una solicitud en ir de un estado a otro.
   *
   * Se mide desde la PRIMERA vez que entró a `desde` hasta la primera vez que
   * llegó a `hasta` después de eso. Si por el camino fue y volvió —de Creando
   * a Pendiente y de vuelta— esa vuelta cuenta, porque quien pidió la esperó
   * igual: lo que se mide es la espera, no el trabajo.
   *
   * Null cuando ese tramo no se completó: una que todavía no llega a `hasta`
   * no esperó cero, simplemente no se puede medir todavía.
   */
  function horasEntre(s, desde, hasta) {
    var r = s.recorrido || [];
    var inicio = null;
    for (var i = 0; i < r.length; i++) {
      if (inicio === null) {
        if (sinTildes(r[i].estado) === sinTildes(desde)) inicio = aFecha(r[i].fecha);
        continue;
      }
      if (sinTildes(r[i].estado) === sinTildes(hasta)) {
        return horasHabiles(inicio, aFecha(r[i].fecha));
      }
    }
    return null;
  }

  /**
   * En qué se va la espera: los tres tramos en que se parte el camino.
   *
   * Son tres y no dos a propósito. Dos solos no son un entero —sumarlos no da
   * nada— y un círculo partido en dos trozos que no forman un todo miente. Los
   * tres seguidos SÍ suman el total, así que el círculo dice de verdad en qué
   * se va la espera de quien pidió.
   */
  var ETAPAS_ESPERA = [
    { desde: 'Solicitando', hasta: 'Validando información',
      titulo: 'Solicitando → Validando', paso: 1 },
    { desde: 'Validando información', hasta: 'Creando',
      titulo: 'Validando → Creando', paso: 3 },
    { desde: 'Creando', hasta: 'Finalizado',
      titulo: 'Creando → Finalizado', paso: 5 }
  ];

  function promedio(numeros) {
    if (!numeros.length) return null;
    var suma = 0;
    for (var i = 0; i < numeros.length; i++) suma += numeros[i];
    return suma / numeros.length;
  }

  /**
   * El promedio de cada etapa, sobre las solicitudes que recorrieron TODAS.
   *
   * Tiene que ser sobre las mismas: si cada etapa se promediara sobre las
   * suyas, los tres números no sumarían el total y el círculo quedaría
   * repartiendo algo que no existe.
   */
  function repartoDeLaEspera(lista) {
    var completas = [];
    (lista || []).forEach(function (s) {
      var horas = ETAPAS_ESPERA.map(function (e) { return horasEntre(s, e.desde, e.hasta); });
      if (horas.every(function (h) { return h !== null; })) completas.push(horas);
    });

    var etapas = ETAPAS_ESPERA.map(function (e, i) {
      return {
        titulo: e.titulo,
        paso: e.paso,
        horas: promedio(completas.map(function (h) { return h[i]; }))
      };
    });

    var total = completas.length
      ? etapas.reduce(function (suma, e) { return suma + e.horas; }, 0)
      : null;

    return { etapas: etapas, total: total, sobre: completas.length };
  }

  /**
   * Los porcentajes enteros de un reparto, que suman 100.
   *
   * Redondear cada uno por su cuenta puede dar 99 o 101, y un círculo que dice
   * 101% se lee como un error aunque el dibujo esté bien. Se reparte el sobrante
   * entre los que más perdieron al redondear, que es lo que hace cualquiera a
   * mano: el que quedó en 33,8 sube antes que el que quedó en 33,1.
   */
  function porcentajes(valores) {
    var total = valores.reduce(function (s, v) { return s + v; }, 0);
    if (!total) return valores.map(function () { return 0; });

    var exactos = valores.map(function (v) { return (v / total) * 100; });
    var enteros = exactos.map(Math.floor);
    var falta = 100 - enteros.reduce(function (s, v) { return s + v; }, 0);

    exactos.map(function (v, i) { return { i: i, resto: v - Math.floor(v) }; })
      .sort(function (a, b) { return b.resto - a.resto; })
      .slice(0, falta)
      .forEach(function (x) { enteros[x.i]++; });

    return enteros;
  }

  /** `12,5 h`, `45 min`, o un guion si todavía no hay con qué. */
  function enHoras(valor) {
    if (valor === null || valor === undefined) return '—';
    if (valor < 1) return Math.round(valor * 60) + ' min';
    return String(Math.round(valor * 10) / 10).replace('.', ',') + ' h';
  }

  /** El eje de arriba en un número redondo, con unas pocas líneas de grilla. */
  function escalaY(maximo) {
    if (maximo <= 0) return { tope: 1, paso: 1 };
    var pasos = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000];
    for (var i = 0; i < pasos.length; i++) {
      if (maximo / pasos[i] <= 4) {
        return { tope: Math.ceil(maximo / pasos[i]) * pasos[i], paso: pasos[i] };
      }
    }
    var p = pasos[pasos.length - 1];
    return { tope: Math.ceil(maximo / p) * p, paso: p };
  }
</script>
