<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* El mismo verde bosque del formulario de entrada: son la misma herramienta. */
  :root {
    --bosque-900: oklch(0.24 0.045 158);
    --bosque-800: oklch(0.31 0.058 158);
    --bosque-700: oklch(0.38 0.072 157);
    --bosque-600: oklch(0.47 0.095 156);
    --bosque-200: oklch(0.88 0.045 157);
    --bosque-100: oklch(0.94 0.028 157);
    --bosque-050: oklch(0.972 0.014 157);

    --fondo: oklch(0.965 0.007 157);
    --papel: oklch(0.995 0.002 157);
    --tinta: oklch(0.21 0.014 157);
    --tinta-suave: oklch(0.46 0.018 157);
    --linea: oklch(0.89 0.008 157);

    --ambar: oklch(0.515 0.115 68);
    --ambar-fondo: oklch(0.965 0.03 82);
    --rojo: oklch(0.51 0.17 27);
    --rojo-fondo: oklch(0.965 0.022 25);

    /*
      Los cinco estados son un ORDEN, no cinco cosas distintas: una solicitud
      va de Solicitando a Finalizado. Por eso el gráfico usa una sola tinta que
      se oscurece paso a paso —el avance se ve en el color mismo— y no cinco
      colores sueltos, que dirían que son cosas sin relación.

      Los pasos están medidos, no elegidos a ojo: luminosidad siempre a la baja,
      cada salto de al menos 0.06, y el más claro a 2.10:1 contra el papel.
    */
    --paso-1: oklch(0.75 0.11 157);
    --paso-2: oklch(0.66 0.13 157);
    --paso-3: oklch(0.57 0.135 157);
    --paso-4: oklch(0.47 0.105 157);
    --paso-5: oklch(0.36 0.08 157);
    /** Un estado escrito a mano que no es de los cinco: se muestra, en gris. */
    --paso-otro: oklch(0.72 0.012 157);

    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    --r: 10px;
    --salida: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0; background: var(--fondo); color: var(--tinta);
    font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased;
  }

  header.app {
    background: var(--bosque-900); color: #fff;
    padding: 14px 20px; position: sticky; top: 0; z-index: 30;
  }
  .cabecera-fila {
    max-width: 1400px; margin: 0 auto;
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  header.app h1 { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
  header.app .cuantas { color: oklch(0.85 0.03 157); font-size: 13.5px; }
  header.app .quien {
    margin-left: auto; font: 13px var(--mono); color: oklch(0.82 0.03 157);
  }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 20px 20px 60px; }

  /* --------------------------------------------------------------- filtros */

  .filtros {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    margin-bottom: 16px;
  }
  .filtros input, .filtros select {
    padding: 9px 12px; border: 1px solid var(--linea); border-radius: var(--r);
    background: var(--papel); color: var(--tinta); font: 14px var(--sans);
  }
  .filtros input { flex: 1 1 320px; min-width: 0; }
  .filtros input:focus-visible, .filtros select:focus-visible {
    outline: 2px solid var(--bosque-600); outline-offset: 1px;
  }
  .filtros .cuenta { color: var(--tinta-suave); font-size: 13.5px; margin-left: auto; }

  /* --------------------------------------------------------------- tabla */

  .caja { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--r);
    overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th {
    background: var(--bosque-050); color: var(--bosque-800);
    font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--bosque-200);
    white-space: nowrap;
  }
  tbody td { padding: 11px 12px; border-top: 1px solid var(--linea); vertical-align: top; }
  tbody tr.cabecera:hover { background: var(--bosque-050); }
  .mono { font-family: var(--mono); font-size: 13px; }
  .numero { font: 700 14px var(--mono); color: var(--bosque-700); white-space: nowrap; }
  .apagado { color: var(--tinta-suave); }
  .obs { max-width: 260px; font-size: 13.5px; color: var(--tinta-suave); }

  /* El estado: se muestra y se abre, pero no se cambia. */
  .pastilla {
    display: inline-block; padding: 4px 11px; border-radius: 999px;
    font-size: 12px; font-weight: 700; white-space: nowrap;
    background: var(--bosque-100); color: var(--bosque-800);
    border: 0; font-family: inherit; cursor: pointer;
    transition: box-shadow .15s var(--salida);
  }
  .pastilla:hover { box-shadow: 0 0 0 2px var(--bosque-200); }
  .pastilla:focus-visible { outline: 2px solid var(--bosque-600); outline-offset: 2px; }
  .pastilla.solicitando { background: var(--ambar-fondo); color: var(--ambar); }
  .pastilla.validandoinformacion { background: var(--bosque-050); color: var(--bosque-700); }
  .pastilla.pendiente { background: var(--rojo-fondo); color: var(--rojo); }
  .pastilla.creando { background: var(--bosque-100); color: var(--bosque-800); }
  .pastilla.finalizado { background: var(--bosque-600); color: #fff; }
  .pastilla.vacia { background: transparent; color: var(--tinta-suave); font-weight: 400; }

  button.vermas {
    background: none; border: 0; padding: 0; cursor: pointer; font: inherit;
    color: var(--bosque-700); text-decoration: underline; white-space: nowrap;
  }
  button.vermas:hover { color: var(--bosque-600); }
  button.vermas:focus-visible { outline: 2px solid var(--bosque-600); outline-offset: 2px; }

  /* Los códigos desplegados, dentro de la fila de su solicitud. */
  tr.codigos > td { padding: 0; background: var(--bosque-050); }
  .dentro { padding: 12px 14px 16px; }
  .dentro h3 {
    margin: 0 0 8px; font-size: 12px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--tinta-suave);
  }
  /* Por dónde pasó la solicitud: un paso por línea, el último resaltado. */
  .recorrido { margin-bottom: 18px; }
  ol.pasos {
    margin: 0; padding: 0; list-style: none;
    display: grid; gap: 1px; background: var(--bosque-200);
    border: 1px solid var(--bosque-200); border-radius: 8px; overflow: hidden;
    max-width: 520px;
  }
  ol.pasos li {
    display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: baseline;
    padding: 8px 12px; background: var(--papel); font-size: 13.5px;
  }
  ol.pasos li.actual { background: var(--bosque-100); }
  ol.pasos li.actual .paso-estado { font-weight: 700; color: var(--bosque-800); }
  .paso-fecha { color: var(--tinta-suave); white-space: nowrap; }
  .paso-quien { color: var(--tinta-suave); font-size: 12.5px; white-space: nowrap; }

  .desliza { overflow-x: auto; }
  table.detalle { background: var(--papel); border: 1px solid var(--bosque-200);
    border-radius: 8px; overflow: hidden; }
  table.detalle th { background: transparent; border-bottom: 1px solid var(--bosque-200); }
  table.detalle td { padding: 8px 12px; white-space: nowrap; }
  table.detalle tr:first-child td { border-top: 0; }

  /* ------------------------------------------ el panel: tarjetas y gráfico */

  .panel { margin-bottom: 18px; }

  .tarjetas {
    display: grid; gap: 12px; margin-bottom: 12px;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  }
  .tarjeta {
    background: var(--papel); border: 1px solid var(--linea); border-radius: var(--r);
    padding: 12px 14px; display: flex; flex-direction: column; gap: 2px;
  }
  .tarjeta .rotulo { font-size: 12.5px; color: var(--tinta-suave); }
  .tarjeta .valor { font-size: 26px; font-weight: 600; line-height: 1.15; }
  .tarjeta .nota { font-size: 12px; color: var(--tinta-suave); }

  /* El de barras manda el ancho; la dona ocupa lo que necesita y no más. */
  .dos-graficos {
    display: grid; gap: 12px;
    grid-template-columns: minmax(0, 1fr) 320px;
    align-items: start;
  }
  @media (max-width: 980px) {
    .dos-graficos { grid-template-columns: minmax(0, 1fr); }
  }

  .caja.grafico, .caja.dona-caja { padding: 14px 16px 16px; }
  .grafico-cabecera {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 14px; flex-wrap: wrap; margin-bottom: 10px;
  }
  .grafico-cabecera h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .grafico-cabecera .sub { margin: 2px 0 0; font-size: 12.5px; color: var(--tinta-suave); }

  .escala { display: inline-flex; border: 1px solid var(--bosque-200); border-radius: 999px; }
  .escala button {
    background: none; border: 0; padding: 5px 13px; border-radius: 999px;
    font: 500 13px var(--sans); color: var(--tinta-suave); cursor: pointer;
  }
  .escala button.activa { background: var(--bosque-700); color: #fff; }
  .escala button:focus-visible { outline: 2px solid var(--bosque-600); outline-offset: 2px; }

  .lienzo { position: relative; overflow-x: auto; }
  .lienzo svg { display: block; }
  .sin-datos { padding: 48px 0; text-align: center; color: var(--tinta-suave); margin: 0; }

  .grilla { stroke: var(--linea); stroke-width: 1; }
  .eje-base { stroke: var(--bosque-200); stroke-width: 1; }
  .tick, .eje { font: 11px var(--mono); fill: var(--tinta-suave); }
  .tope { font: 600 11px var(--sans); fill: var(--tinta-suave); }
  .barra { transition: opacity .12s var(--salida); }
  .apagada { opacity: .35; }
  rect.blanco { fill: transparent; cursor: default; }
  rect.blanco:focus-visible { outline: 2px solid var(--bosque-600); outline-offset: 1px; }

  .leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; }
  .llave { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px;
    color: var(--tinta-suave); }
  .llave i { width: 11px; height: 11px; border-radius: 3px; flex: none; }

  .caja.grafico .pie {
    margin: 10px 0 0; font-size: 12.5px; color: var(--tinta-suave); max-width: 72ch;
  }

  .globo {
    position: absolute; z-index: 5; pointer-events: none;
    background: var(--papel); border: 1px solid var(--bosque-200); border-radius: 8px;
    padding: 9px 11px; min-width: 168px; font-size: 13px;
    box-shadow: 0 6px 20px oklch(0.24 0.045 158 / 0.14);
  }
  .globo-titulo { font-size: 12px; color: var(--tinta-suave); margin-bottom: 2px; }
  .globo-total { font-weight: 600; margin-bottom: 6px; }
  .globo-fila { display: grid; grid-template-columns: 11px auto 1fr; gap: 8px;
    align-items: baseline; line-height: 1.7; }
  .globo-fila i { width: 11px; height: 11px; border-radius: 3px; }
  .globo-fila b { font-variant-numeric: tabular-nums; }
  .globo-fila span { color: var(--tinta-suave); font-size: 12.5px; }

  /* ------------------------------------------- la dona: en qué se va la espera */

  .dona { position: relative; max-width: 220px; margin: 6px auto 2px; }
  .dona svg { display: block; }
  /*
    Solo el aro responde al puntero. Sin esto el agujero del medio —que es
    relleno vacío, no fondo— se traga el evento y apuntar una tajada no hace
    nada. La fila de la leyenda es el blanco grande; la tajada, el fino.
  */
  .tajada { transition: opacity .12s var(--salida); pointer-events: stroke; cursor: default; }
  .dona-centro {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1px; pointer-events: none;
  }
  .dona-total { font-size: 27px; font-weight: 600; line-height: 1.1; }
  .dona-pie { font-size: 12px; color: var(--tinta-suave); }

  .dona-leyenda { margin-top: 14px; display: grid; gap: 1px; }
  .llave-fila {
    display: grid; grid-template-columns: 11px 1fr auto 38px;
    gap: 9px; align-items: baseline; padding: 5px 4px; border-radius: 6px;
    font-size: 13px; transition: background .12s var(--salida), opacity .12s var(--salida);
  }
  .llave-fila:hover, .llave-fila:focus-visible { background: var(--bosque-050); outline: none; }
  .llave-fila i { width: 11px; height: 11px; border-radius: 3px; }
  .llave-nombre { color: var(--tinta-suave); }
  .llave-valor { font-variant-numeric: tabular-nums; }
  .llave-parte { color: var(--tinta-suave); font-size: 12px; text-align: right;
    font-variant-numeric: tabular-nums; }

  .vacio { padding: 40px 20px; text-align: center; color: var(--tinta-suave); }
  .cargando { padding: 60px 0; text-align: center; color: var(--tinta-suave); }
  .aviso {
    padding: 12px 15px; border-radius: var(--r); font-size: 14px; margin-bottom: 16px;
    background: var(--rojo-fondo); border: 1px solid oklch(0.86 0.06 25); color: var(--rojo);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
  }

  @media (max-width: 720px) {
    header.app { position: static; }
    .filtros .cuenta { margin-left: 0; }
    .caja { overflow-x: auto; }
    table { min-width: 860px; }
  }
</style>
