<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest: #1E4D38;
      --forest2: #2D6A4F;
      --forest3: #52796F;
      --soft: #E6EFEA;
      --light: #F4F8F6;
      --white: #FFFFFF;
      --text: #24352B;
      --muted: #738579;
      --border: #DCE5DF;
      --danger: #B3261E;
      --danger-soft: #FBEAE9;
      --warning: #C28A22;
      --warning-soft: #FBF1DF;
      --wood: #8D6E63;
      --wood-soft: #F1E9E7;
      --success: #2D6A4F;
      --success-soft: #E6F4EC;
      --shadow: 0 8px 24px rgba(30, 77, 56, .08);
      --shadow-lg: 0 20px 48px rgba(20, 30, 25, .18);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(30,77,56,.08), transparent 32%),
        radial-gradient(circle at bottom right, rgba(82,121,111,.08), transparent 38%),
        var(--light);
      color: var(--text);
      min-height: 100%;
    }
    .app { max-width: 1180px; margin: 0 auto; padding: 0 22px 40px; }

    .hero {
      background: linear-gradient(120deg, var(--forest), var(--forest2) 60%, var(--forest3));
      color: white;
      padding: 30px 34px;
      border-radius: 0 0 24px 24px;
      margin-bottom: -26px;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: '';
      position: absolute;
      right: -60px; top: -60px;
      width: 220px; height: 220px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
    }
    .hero-top { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
    .hero-icon {
      width: 46px; height: 46px;
      background: rgba(255,255,255,.15);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .hero h1 { font-size: 21px; margin: 0; letter-spacing: -.2px; }
    .hero .subtitle { color: rgba(255,255,255,.8); font-size: 13px; margin-top: 3px; }

    .toolbar {
      position: relative;
      z-index: 2;
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 18px 20px;
      margin: 0 0 22px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-input-wrap { position: relative; flex: 1; min-width: 220px; display: flex; align-items: center; }
    .search-input-wrap svg { position: absolute; left: 14px; color: var(--muted); pointer-events: none; }
    .search-input-wrap input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: var(--light);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .search-input-wrap input:focus {
      outline: none;
      border-color: var(--forest2);
      box-shadow: 0 0 0 4px rgba(45,106,79,.12);
      background: white;
    }
    select#filtroEstado {
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 13.5px;
      font-family: inherit;
      background: var(--light);
      color: var(--text);
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      padding: 12px 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: filter .15s ease, transform .1s ease;
    }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(120deg, var(--forest), var(--forest2)); color: white; box-shadow: 0 6px 16px rgba(30,77,56,.25); }

    .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

    .msg {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 13.5px;
      margin-bottom: 18px;
      animation: fadeInUp .2s ease;
    }
    .msg svg { flex-shrink: 0; margin-top: 1px; }
    .msg-error { background: var(--danger-soft); color: var(--danger); }
    .hidden { display: none !important; }

    .results-card {
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--soft);
    }
    .results-header h3 { margin: 0; font-size: 14px; color: var(--forest); }
    .results-count {
      font-size: 11px;
      font-weight: 700;
      color: var(--forest2);
      background: var(--soft);
      padding: 4px 10px;
      border-radius: 999px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    thead th {
      text-align: left;
      color: var(--muted);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .4px;
      font-weight: 800;
      padding: 10px 20px;
      background: var(--light);
      white-space: nowrap;
    }
    tbody td { padding: 12px 20px; border-top: 1px solid var(--soft); vertical-align: middle; }
    tbody tr { animation: fadeInUp .25s ease; }
    tbody tr:hover { background: #FAFCFB; }
    .provider-name { font-weight: 700; color: var(--text); }
    .muted-cell { color: var(--muted); font-size: 12.5px; }

    .badge {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .badge-tipo-modificar { background: var(--wood-soft); color: var(--wood); }
    .badge-tipo-agregar { background: var(--soft); color: var(--forest); }
    .badge-estado-analisis { background: #E5EEF7; color: #2A5A87; }
    .badge-estado-actualizando { background: var(--warning-soft); color: var(--warning); }
    .badge-estado-modificado { background: var(--success-soft); color: var(--success); }
    .badge-estado-otro { background: var(--soft); color: var(--muted); }

    .empty-state {
      padding: 46px 20px;
      text-align: center;
      color: var(--muted);
    }
    .empty-state svg { margin-bottom: 12px; color: var(--forest3); opacity: .5; }
    .skeleton-row { display: flex; gap: 14px; align-items: center; padding: 14px 20px; }
    .skeleton-block { border-radius: 8px; background: var(--soft); animation: pulse 1.2s ease-in-out infinite; }

    @media (max-width: 720px) {
      .app { padding: 0 12px 30px; }
      .hero { padding: 24px 18px; border-radius: 0 0 18px 18px; }
      .toolbar { padding: 14px 16px; }
      thead { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tbody td { border-top: none; padding: 5px 20px; }
      tbody tr { border-bottom: 1px solid var(--soft); padding: 12px 0; }
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="hero-top">
      <div class="hero-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div>
        <h1>Solicitudes Bancarias · Proveedores Extranjeros</h1>
        <div class="subtitle">Seguimiento de modificaciones y creaciones de cuenta bancaria</div>
      </div>
    </div>
  </div>

  <div class="app">
    <div class="toolbar">
      <div class="search-input-wrap">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm10 2-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input id="inputBusqueda" type="text" placeholder="Filtrar por solicitante o razón social..." />
      </div>
      <select id="filtroEstado">
        <option value="">Todos los estados</option>
        <option value="En analisis">En analisis</option>
        <option value="Actualizando">Actualizando</option>
        <option value="Modificado">Modificado</option>
      </select>
      <button class="btn-primary" id="btnRecargar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 4v5h5M20 20v-5h-5M4.6 15a8 8 0 0 0 14.5 2.5M19.4 9A8 8 0 0 0 4.9 6.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Actualizar
      </button>
    </div>

    <div id="mensaje" class="hidden"></div>

    <div class="results-card">
      <div class="results-header">
        <h3>Solicitudes</h3>
        <span class="results-count hidden" id="resultsCount">0</span>
      </div>
      <div id="resultsBody">
        <div class="skeleton-row">
          <div class="skeleton-block" style="width:100%;height:16px;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var todasLasSolicitudes = [];

    var ICONS = {
      error: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 8v5m0 3h.01M10.29 3.86 1.82 18a1.5 1.5 0 0 0 1.29 2.25h17.78A1.5 1.5 0 0 0 22.18 18L13.71 3.86a1.5 1.5 0 0 0-2.63 0Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      empty: '<svg width="42" height="42" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };

    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('btnRecargar').addEventListener('click', cargarSolicitudes);
      document.getElementById('inputBusqueda').addEventListener('input', renderFiltrado);
      document.getElementById('filtroEstado').addEventListener('change', renderFiltrado);
      cargarSolicitudes();
    });

    function mostrarMensaje(texto) {
      var el = document.getElementById('mensaje');
      el.className = 'msg msg-error';
      el.innerHTML = ICONS.error + '<div>' + texto + '</div>';
    }

    function ocultarMensaje() {
      document.getElementById('mensaje').className = 'hidden';
    }

    function renderCargando() {
      var body = document.getElementById('resultsBody');
      var filas = '';
      for (var i = 0; i < 5; i++) {
        filas += '<div class="skeleton-row"><div class="skeleton-block" style="width:100%;height:16px;"></div></div>';
      }
      body.innerHTML = filas;
      document.getElementById('resultsCount').classList.add('hidden');
    }

    function cargarSolicitudes() {
      ocultarMensaje();
      var btn = document.getElementById('btnRecargar');
      btn.disabled = true;
      var textoOriginal = btn.innerHTML;
      btn.innerHTML = '<span class="spinner"></span> Cargando...';
      renderCargando();

      google.script.run
        .withSuccessHandler(function (solicitudes) {
          btn.disabled = false;
          btn.innerHTML = textoOriginal;
          todasLasSolicitudes = solicitudes || [];
          renderFiltrado();
        })
        .withFailureHandler(function (error) {
          btn.disabled = false;
          btn.innerHTML = textoOriginal;
          document.getElementById('resultsBody').innerHTML = '';
          document.getElementById('resultsCount').classList.add('hidden');
          mostrarMensaje('Error al cargar las solicitudes: ' + (error && error.message ? error.message : error));
        })
        .listarSolicitudes();
    }

    function badgeTipoSolicitud(tipo) {
      var clase = /agregar/i.test(tipo) ? 'badge-tipo-agregar' : 'badge-tipo-modificar';
      return '<span class="badge ' + clase + '">' + escapeHtml(tipo || '—') + '</span>';
    }

    function badgeEstado(estado) {
      var clase = 'badge-estado-otro';
      if (/analisis/i.test(estado)) clase = 'badge-estado-analisis';
      else if (/actualizando/i.test(estado)) clase = 'badge-estado-actualizando';
      else if (/modificado/i.test(estado)) clase = 'badge-estado-modificado';
      return '<span class="badge ' + clase + '">' + escapeHtml(estado || '—') + '</span>';
    }

    function escapeHtml(texto) {
      var div = document.createElement('div');
      div.textContent = texto == null ? '' : texto;
      return div.innerHTML;
    }

    function renderFiltrado() {
      var termino = document.getElementById('inputBusqueda').value.trim().toLowerCase();
      var estadoFiltro = document.getElementById('filtroEstado').value;

      var filtradas = todasLasSolicitudes.filter(function (s) {
        var coincideTermino = !termino ||
          (s.solicitante || '').toLowerCase().indexOf(termino) > -1 ||
          (s.razonSocial || '').toLowerCase().indexOf(termino) > -1;
        var coincideEstado = !estadoFiltro || s.estado === estadoFiltro;
        return coincideTermino && coincideEstado;
      });

      renderTabla(filtradas);
    }

    function renderTabla(solicitudes) {
      var body = document.getElementById('resultsBody');
      var count = document.getElementById('resultsCount');

      if (solicitudes.length === 0) {
        body.innerHTML = '<div class="empty-state">' + ICONS.empty + '<div>No hay solicitudes para mostrar.</div></div>';
        count.classList.add('hidden');
        return;
      }

      count.textContent = solicitudes.length + (solicitudes.length === 1 ? ' solicitud' : ' solicitudes');
      count.classList.remove('hidden');

      var tabla = document.createElement('table');
      tabla.innerHTML =
        '<thead><tr><th>Fecha</th><th>Solicitante</th><th>Razón social</th><th>Tipo de solicitud</th><th>Estado</th></tr></thead><tbody></tbody>';
      var tbody = tabla.querySelector('tbody');

      solicitudes.forEach(function (s) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="muted-cell">' + escapeHtml(s.fecha) + '</td>' +
          '<td>' + escapeHtml(s.solicitante) + '</td>' +
          '<td class="provider-name">' + escapeHtml(s.razonSocial) + '</td>' +
          '<td>' + badgeTipoSolicitud(s.tipoSolicitud) + '</td>' +
          '<td>' + badgeEstado(s.estado) + '</td>';
        tbody.appendChild(tr);
      });

      body.innerHTML = '';
      body.appendChild(tabla);
    }
  </script>
</body>
</html>
